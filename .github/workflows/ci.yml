name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-test-analysis:
    name: Build, tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hw1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: hw1/pom.xml

      - name: Build, run tests and enforce coverage gate
        run: ./mvnw -B clean verify

      - name: Publish JUnit test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v1
        with:
          name: JUnit test results
          path: hw1/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: hw1/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: |
            hw1/target/site/jacoco/
            hw1/target/site/jacoco/jacoco.xml
          if-no-files-found: ignore
