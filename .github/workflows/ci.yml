name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build-test-analysis:
    name: Build, full test suite and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hw1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: hw1/pom.xml

      - name: Install Playwright Chromium
        run: >-
          ./mvnw -B -ntp
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install --with-deps chromium"
          -Dexec.classpathScope=test
          exec:java

      - name: Build, run the full test suite and enforce coverage gate
        # Runs all Surefire-discovered tests, including Cucumber, contract,
        # usability, integration and concurrency tests. No test groups are excluded.
        run: ./mvnw -B -ntp clean verify

      - name: Publish JUnit test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v2.2.0
        with:
          name: JUnit test results
          path: hw1/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: hw1/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage
          path: |
            hw1/target/site/jacoco/
            hw1/target/site/jacoco/jacoco.xml
          if-no-files-found: ignore
