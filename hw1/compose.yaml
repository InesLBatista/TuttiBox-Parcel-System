services:
  sonarqube:
    image: sonarqube:community
    profiles:
      - sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tuttibox
      POSTGRES_USER: tuttibox
      POSTGRES_PASSWORD: tuttibox
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - tuttibox-postgres:/var/lib/postgresql/data

volumes:
  tuttibox-postgres:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
