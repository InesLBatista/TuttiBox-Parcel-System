spring.application.name=hw1

# Runtime datasource (override through environment variables if needed)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tuttibox}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tuttibox}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tuttibox}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Deadlines do ciclo de vida da encomenda (formato ISO-8601)
tuttibox.deadlines.drop-off=PT48H
tuttibox.deadlines.pickup=P7D
tuttibox.deadlines.check-interval-ms=60000
tuttibox.deadlines.scheduling-enabled=true

# Seed idempotente de estações e compartimentos
tuttibox.seed.enabled=true
