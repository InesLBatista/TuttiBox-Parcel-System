<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css">
    <title>TuttiBox - Consulta de tracking</title>
</head>
<body class="page page-tracking">
    <main>
        <header>
            <h1>Consultar estado da encomenda</h1>
            <p>Introduza o código de tracking para ver o estado atual e histórico.</p>
        </header>
        <section class="card">
            <form id="track-form">
                <input id="tracking-code" name="trackingCode" placeholder="TBX-..." required>
                <button type="submit">Consultar</button>
            </form>
        </section>
        <section id="status-card" class="card hidden">
            <h2>Estado atual</h2>
            <p><strong>Código:</strong> <span id="code"></span></p>
            <p><strong>Estado:</strong> <span id="state"></span></p>
        </section>
        <section id="history-card" class="card hidden">
            <h2>Histórico</h2>
            <ul id="history"></ul>
        </section>
        <footer>
            <a href="/">Início</a> | <a href="/recipient.html">Terminal do destinatário</a> | <a href="/courier.html">Terminal do courier</a> | <a href="/operator.html">Supervisão do operador</a>
        </footer>
    </main>
    <script>
        const form=document.getElementById('track-form');
        const trackingInput=document.getElementById('tracking-code');
        const statusCard=document.getElementById('status-card');
        const historyCard=document.getElementById('history-card');
        const codeEl=document.getElementById('code');
        const stateEl=document.getElementById('state');
        const historyEl=document.getElementById('history');
        const params=new URLSearchParams(location.search);
        if(params.get('code')){trackingInput.value=params.get('code');}
        form.addEventListener('submit',async(e)=>{
            e.preventDefault();
            const code=trackingInput.value.trim();
            if(!code)return;
            try{
                const [sRes,hRes]=await Promise.all([
                    fetch('/api/parcels/'+encodeURIComponent(code)+'/status'),
                    fetch('/api/parcels/'+encodeURIComponent(code)+'/history')
                ]);
                if(!sRes.ok) throw new Error('not found');
                const status=await sRes.json();
                const history=await hRes.json();
                codeEl.textContent=code;
                stateEl.textContent=status;
                historyEl.innerHTML='';
                (history||[]).forEach(h=>{
                    const li=document.createElement('li');
                    li.textContent=(h.transitionDate||'')+' - '+(h.fromState||'?')+' -> '+(h.toState||'?')+' ('+(h.actor||'')+')';
                    historyEl.appendChild(li);
                });
                statusCard.classList.remove('hidden');
                historyCard.classList.remove('hidden');
            }catch(err){
                alert('Encomenda não encontrada');
            }
        });
    </script>
</body>
</html>
